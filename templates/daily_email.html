<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bonus Harvest — Daily Report</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f4;font-family:Arial,sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;padding:24px 0;">
    <tr>
      <td align="center">
        <table width="520" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08);">

          <!-- Header -->
          <tr>
            <td style="background:#1a1a2e;padding:20px 24px;">
              <p style="margin:0;font-size:18px;font-weight:bold;color:#ffffff;letter-spacing:1px;">🌾 Bonus Harvest</p>
              <p style="margin:4px 0 0;font-size:11px;color:#666699;">$DATE</p>
            </td>
          </tr>

          <!-- Failure Banner -->
          $FAILURES_SECTION

          <!-- Casino Cards -->
          $CASINO_CARDS

          <!-- Spacer -->
          <tr><td style="height:10px;"></td></tr>

          <!-- Divider -->
          <tr>
            <td style="padding:0 24px;">
              <hr style="border:none;border-top:1px solid #eeeeee;margin:0;">
            </td>
          </tr>

          <!-- Total -->
          <tr>
            <td style="padding:12px 24px 20px;">
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="font-size:12px;color:#999;">Total Est. Payout</td>
                  <td align="right" style="font-size:18px;font-weight:bold;color:#1a9e5c;">$$TOTAL_PAYOUT</td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
